name: Tiger New Energy
description: >-
  Tiger New Energy is a Bangladesh-based clean-energy company building a
  battery-swapping network for electric vehicles, primarily electric rickshaws
  and motorcycles. Drivers swap depleted lithium batteries for fully charged
  ones at Tiger swapping stations in seconds instead of waiting to recharge, and
  a "battery passport" tracks each pack's health and lifecycle. The company
  operates consumer and partner mobile apps (Tiger Driver, Tiger Partner, Tiger
  Dealer) on iOS and Android. Tiger New Energy is a portfolio company of 500
  Global. As of this enrichment pass the company exposes no public developer
  portal, API documentation, SDKs, or machine-readable specifications; its
  mobile apps are backed by private, undocumented services.
